<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14"/>
      <stop offset="50%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#141c30"/>
    </linearGradient>
    
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.95"/>
    </linearGradient>
    
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.25"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="360" fill="url(#bg-grad)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="240" cy="100" r="140" fill="#7c3aed" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1060" cy="200" r="160" fill="#2563eb" opacity="0.15" filter="url(#glow)"/>
  <circle cx="640" cy="340" r="120" fill="#06b6d4" opacity="0.08" filter="url(#glow)"/>

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="60" x2="1280" y2="60"/>
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="300" x2="1280" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="640" y1="0" x2="640" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="960" y1="0" x2="960" y2="360"/>
    <line x1="1120" y1="0" x2="1120" y2="360"/>
  </g>

  <!-- LEFT COLUMN: Typography & Identity -->
  <g transform="translate(64, 48)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="350" height="28" rx="14" fill="url(#pill-grad)" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#10b981"/>
    <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c4b5fd" letter-spacing="0.8">3.48M+ AGENT ASSETS  •  113K+ MCP SERVERS</text>

    <!-- Main Title -->
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#title-grad)" letter-spacing="-0.8">Open-Agent-DB</text>

    <!-- Tagline -->
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500" fill="#94a3b8">The Universal AI Agent Registry &amp; Semantic Search Engine</text>

    <!-- Command Chip Box -->
    <g transform="translate(0, 136)">
      <rect x="0" y="0" width="460" height="42" rx="8" fill="#030712" stroke="#334155" stroke-width="1"/>
      <text x="14" y="26" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="13" font-weight="600" fill="#38bdf8">$</text>
      <text x="30" y="26" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="13" font-weight="500" fill="#f1f5f9">npx open-agent-db search <tspan fill="#34d399">"postgres"</tspan></text>
      <!-- Copy Icon -->
      <g transform="translate(424, 12)" stroke="#64748b" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="3" width="12" height="12" rx="2"/>
        <path d="M4 3V2a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-1"/>
      </g>
    </g>

    <!-- Supported Ecosystem Pills -->
    <g transform="translate(0, 202)">
      <!-- Claude -->
      <rect x="0" y="0" width="88" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="44" y="16" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Claude Code</text>

      <!-- Cursor -->
      <rect x="96" y="0" width="62" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="127" y="16" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Cursor</text>

      <!-- Codex -->
      <rect x="166" y="0" width="60" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="196" y="16" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Codex</text>

      <!-- Gemini -->
      <rect x="234" y="0" width="64" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="266" y="16" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Gemini</text>

      <!-- Copilot -->
      <rect x="306" y="0" width="62" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="337" y="16" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Copilot</text>

      <!-- MCP Registry -->
      <rect x="376" y="0" width="84" height="24" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-opacity="0.6" stroke-width="1"/>
      <text x="418" y="16" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#a78bfa">MCP Hub</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Realistic macOS Terminal Window -->
  <g transform="translate(600, 36)" filter="url(#card-shadow)">
    <!-- Terminal Outer Frame -->
    <rect width="616" height="288" rx="10" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.2"/>
    
    <!-- Titlebar -->
    <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 606 0 C 611.523 0 616 4.477 616 10 L 616 36 L 0 36 Z" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
    
    <!-- macOS Window Controls (Traffic Lights) -->
    <circle cx="20" cy="18" r="5.5" fill="#ef4444"/>
    <circle cx="38" cy="18" r="5.5" fill="#f59e0b"/>
    <circle cx="56" cy="18" r="5.5" fill="#10b981"/>
    
    <!-- Terminal Title -->
    <text x="308" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#64748b">open-agent-db — bash (80×24)</text>

    <!-- Terminal Content Area -->
    <g transform="translate(20, 56)" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="11.5" line-height="1.5">
      <!-- Line 1: Command -->
      <text x="0" y="12" fill="#38bdf8" font-weight="600">&gt; open-agent search "postgres" --ecosystem mcp,universal</text>
      
      <!-- Line 2: Status banner -->
      <text x="0" y="36" fill="#64748b">Query matched 1,842 assets across 7 ecosystems (0.014s)</text>
      
      <!-- Card 1 -->
      <g transform="translate(0, 50)">
        <rect x="0" y="0" width="576" height="42" rx="6" fill="#030712" stroke="#1f293d" stroke-width="1"/>
        <text x="12" y="18" font-weight="700" fill="#34d399">📦 glama:postgresql-mcp</text>
        <rect x="230" y="7" width="94" height="15" rx="3" fill="#8b5cf6" fill-opacity="0.2"/>
        <text x="277" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#c4b5fd">MCP SERVER</text>
        <text x="12" y="33" fill="#94a3b8" font-size="10.5">PostgreSQL Model Context Protocol Server with schema inspection &amp; safe query exec</text>
      </g>
      
      <!-- Card 2 -->
      <g transform="translate(0, 100)">
        <rect x="0" y="0" width="576" height="42" rx="6" fill="#030712" stroke="#1f293d" stroke-width="1"/>
        <text x="12" y="18" font-weight="700" fill="#60a5fa">🤖 claude:database-architect.md</text>
        <rect x="286" y="7" width="96" height="15" rx="3" fill="#3b82f6" fill-opacity="0.2"/>
        <text x="334" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#93c5fd">CLAUDE AGENT</text>
        <text x="12" y="33" fill="#94a3b8" font-size="10.5">Production database migration specialist with rollback verification protocols</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(0, 150)">
        <rect x="0" y="0" width="576" height="42" rx="6" fill="#030712" stroke="#1f293d" stroke-width="1"/>
        <text x="12" y="18" font-weight="700" fill="#a78bfa">⚡ cursor:postgres-rules.mdc</text>
        <rect x="264" y="7" width="86" height="15" rx="3" fill="#06b6d4" fill-opacity="0.2"/>
        <text x="307" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#67e8f9">CURSOR RULE</text>
        <text x="12" y="33" fill="#94a3b8" font-size="10.5">Strict SQL index validation &amp; transaction safety rules for Cursor IDE</text>
      </g>

      <!-- Dual Engine Footer inside Terminal -->
      <text x="0" y="214" fill="#cbd5e1" font-size="10.5">🤗 Hugging Face Hub: <tspan fill="#a78bfa">ns0bj/open-agent-db</tspan> (128-d Vectors + 31 GB SQLite FTS5)</text>
    </g>
  </g>
</svg>
